<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReadIT</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="assets/script.js" defer></script>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <i class="fa-solid fa-book-open-reader"></i> ReadIT
      </div>
      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search books..." class="search-bar" />
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <form action="#" class="form hidden">
        <div class="labels">
          <label for="title">Title </label>
          <input type="text" name="title" id="title" />
        </div>
        <div class="labels">
          <label for="author">Author</label>
          <input type="text" name="author" id="author" />
        </div>
        <div class="labels">
          <label for="year">Year</label>
          <input type="text" name="year" id="year" />
        </div>
        <div class="labels">
          <label for="pages">Pages</label>
          <input type="number" name="pages" id="pages" />
        </div>
        <input type="submit" value="Add Book" />
      </form>
      <div class="addbtn"><i class="fa-solid fa-plus fa-lg"></i></div>
    </main>

    <!--Footer Navigation -->
    <footer class="footer">
      <nav class="nav">
        <a href="#home"><i class="fa-solid fa-house"></i></a>
        <a href="#fav"><i class="fa-solid fa-heart"></i></a>
        <a href="#search"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="#sett"><i class="fa-solid fa-gear"></i></a>
      </nav>
      <div class="userpfp">
        <a href="#user"><i class="fa-solid fa-user"></i></a>
      </div>
    </footer>
  </body>
</html>
